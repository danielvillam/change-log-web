<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambios programación de médicos</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7f5;
        --card: #ffffff;
        --ink: #1f2a1f;
        --muted: #566656;
        --line: #d9e2da;
        --accent: #2f6f5e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: 24px;
      }

      .shell {
        max-width: 760px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
      }

      p {
        margin: 0;
        line-height: 1.5;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      label {
        font-weight: 700;
      }

      input,
      textarea,
      button {
        font: inherit;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid #c7d4c9;
        border-radius: 10px;
        padding: 10px 12px;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>Registro de cambios en programación de médicos</h1>
      <p>Base inicial del proyecto para capturar cambios y conectarlos después con Google Apps Script.</p>

      <form aria-label="Registro de cambios médicos">
        <div class="field">
          <label for="fecha">Fecha</label>
          <input id="fecha" name="fecha" type="date" required />
        </div>

        <div class="field">
          <label for="cambio">Cambio</label>
          <input id="cambio" name="cambio" type="text" required placeholder="Ej. Ajuste en cirugía" />
        </div>

        <div class="field">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" required placeholder="Describe el cambio"></textarea>
        </div>

        <div class="field">
          <label for="medico">Médico</label>
          <input id="medico" name="medico" type="text" required placeholder="Nombre del médico" />
        </div>

        <div class="field">
          <label for="website">Website</label>
          <input id="website" name="website" type="text" autocomplete="off" />
        </div>

        <button type="submit">Guardar cambio</button>
      </form>
    </main>
  </body>
</html>
