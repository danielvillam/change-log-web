<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambios programación de médicos</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f5f7f5;
        color: #1f2a1f;
        padding: 24px;
      }

      .shell {
        max-width: 720px;
        width: 100%;
        background: #fff;
        border: 1px solid #d9e2da;
        border-radius: 12px;
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
      }

      p {
        margin: 0;
        line-height: 1.5;
        color: #566656;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>Registro de cambios en programación de médicos</h1>
      <p>Base inicial del proyecto para capturar cambios y conectarlos después con Google Apps Script.</p>
    </main>
  </body>
</html>
