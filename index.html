<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambios programación de médicos</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7f5;
        --card: #ffffff;
        --ink: #1f2a1f;
        --muted: #566656;
        --line: #d9e2da;
        --accent: #2f6f5e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: 24px;
      }

      .shell {
        max-width: 760px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
      }

      p {
        margin: 0;
        line-height: 1.5;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      label {
        font-weight: 700;
      }

      input,
      textarea,
      button {
        font: inherit;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid #c7d4c9;
        border-radius: 10px;
        padding: 10px 12px;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      button[disabled] {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .status {
        min-height: 1.25rem;
        margin: 0;
        color: var(--muted);
      }

      .status--success {
        color: #1e7a41;
      }

      .status--error {
        color: #b42318;
      }

      .hp {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>Registro de cambios en programación de médicos</h1>

      <form id="change-form" aria-label="Registro de cambios médicos">
        <div class="field">
          <label for="fecha">Fecha</label>
          <input id="fecha" name="fecha" type="date" required />
        </div>

        <div class="field">
          <label for="cambio">Cambio</label>
          <input id="cambio" name="cambio" type="text" required minlength="3" maxlength="120" placeholder="Ej. Ajuste en cirugía" />
        </div>

        <div class="field">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" required minlength="5" maxlength="1000" placeholder="Describe el cambio"></textarea>
        </div>

        <div class="field">
          <label for="medico">Médico</label>
          <input id="medico" name="medico" type="text" required minlength="3" maxlength="120" placeholder="Nombre del médico" />
        </div>

        <div class="field hp" aria-hidden="true">
          <label for="website">Website</label>
          <input id="website" name="website" type="text" autocomplete="off" tabindex="-1" />
        </div>

        <button id="submit-btn" type="submit">Guardar cambio</button>
        <p id="status" class="status" aria-live="polite"></p>
      </form>
    </main>

    <script>
      (function () {
        "use strict";

        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw29f5o-O7RKEoQ8zmcpFUAEZAz-Z5knHUGLY_c-mDywVu7-3tE1NJnKvSyTeNAFFToKA/exec";
        const ACCESS_TOKEN = "change-log-web-token";
        const form = document.getElementById("change-form");
        const submitBtn = document.getElementById("submit-btn");
        const statusEl = document.getElementById("status");

        function setStatus(message, type) {
          statusEl.textContent = message;
          statusEl.className = "status";
          if (type === "success") {
            statusEl.classList.add("status--success");
          }
          if (type === "error") {
            statusEl.classList.add("status--error");
          }
        }

        async function sendChange(payload) {
          const response = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=UTF-8"
            },
            body: JSON.stringify(payload)
          });

          const responseText = await response.text();

          let data;
          try {
            data = responseText ? JSON.parse(responseText) : {};
          } catch (error) {
            throw new Error("Respuesta no valida del servidor.");
          }

          if (!response.ok || data.status !== "success") {
            throw new Error(data.message || "No se pudo guardar el cambio.");
          }

          return data;
        }

        form.addEventListener("submit", async function (event) {
          event.preventDefault();

          const formData = new FormData(form);
          const payload = {
            fecha: formData.get("fecha"),
            cambio: formData.get("cambio"),
            descripcion: formData.get("descripcion"),
            medico: formData.get("medico"),
            website: formData.get("website"),
            token: ACCESS_TOKEN
          };

          submitBtn.disabled = true;
          setStatus("Enviando...");

          try {
            await sendChange(payload);

            form.reset();
            setStatus("Formulario enviado correctamente.", "success");
          } catch (error) {
            const message = error instanceof Error ? error.message : "Error al enviar el formulario.";
            setStatus(message, "error");
          } finally {
            submitBtn.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
